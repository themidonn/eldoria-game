# ============================================================
#   deploy.yml — автодеплой игры на GitHub Pages
#   Собирает проект через Pygbag и публикует в интернете.
# ============================================================

name: Deploy Game to GitHub Pages

# ============================================================
#   ТРИГГЕРЫ
# ============================================================
on:
  push:
    branches: [ main ]

# ============================================================
#   ПРАВА ДОСТУПА
# ============================================================
permissions:
  contents: read      # читаем код репозитория
  pages: write        # публикуем на GitHub Pages
  id-token: write     # OIDC-токен для безопасного деплоя

# ============================================================
#   ЗАДАЧА
# ============================================================
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Без блока `environment` деплой на Pages падает с ошибкой 404.
    # Здесь же GitHub берёт финальный URL из шага `deployment`.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Принудительный UTF-8 — иначе Python на Linux-сервере
    # не прочитает русские буквы в исходниках.
    env:
      PYTHONUTF8: 1

    # ========================================================
    #   ШАГИ СБОРКИ
    # ========================================================
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Pygbag стабильно работает на 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Фиксируем версии, чтобы сборка не сломалась от внезапного релиза.
          pip install pygame-ce pygbag==0.9.3

      # Pygbag собирает проект в WebAssembly (WASM),
      # чтобы игра запускалась в браузере.
      - name: Build with Pygbag
        run: python -m pygbag --build .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web     # папка с собранной веб-версией

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5