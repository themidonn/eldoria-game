# ============================================================
#   deploy.yml — автодеплой игры на GitHub Pages
#   Путь: .github/workflows/deploy.yml
#   Собирает проект через Pygbag и публикует в интернете.
# ============================================================

name: Deploy Game to GitHub Pages

# ============================================================
#   ТРИГГЕРЫ
#   workflow_dispatch — ручной запуск из вкладки Actions
#                       (перезапуск без пустого коммита)
#   push              — автосборка при пуше в main
# ============================================================
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

# ============================================================
#   ПРАВА ДОСТУПА
#   Минимально необходимые для деплоя на Pages.
# ============================================================
permissions:
  contents: read      # читаем код репозитория
  pages: write        # публикуем на GitHub Pages
  id-token: write     # OIDC-токен для безопасного деплоя

# ============================================================
#   КОНКУРЕНТНОСТЬ
#   При новом пуше в main отменяем предыдущий деплой,
#   чтобы не гонять два параллельных процесса.
# ============================================================
concurrency:
  group: "pages"
  cancel-in-progress: true

# ============================================================
#   ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ
#   PYTHONUTF8=1 — иначе Python на Linux-раннере
#   не прочитает русские буквы в исходниках.
#   Значение в кавычках — чтобы YAML не превратил его в int.
#   Объявлено глобально, а не внутри job — применяется ко всем
#   шагам и не требует повторения при добавлении второго job.
# ============================================================
env:
  PYTHONUTF8: "1"

# ============================================================
#   ЗАДАЧА
# ============================================================
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # 15 минут с запасом: первая сборка без кэша ~5–7 мин,
    # с кэшем ~2–3 мин. Если pygbag зависнет — задача упадёт,
    # а не будет висеть до лимита GitHub (6 часов).
    timeout-minutes: 15

    # Без блока `environment` деплой на Pages падает с ошибкой 404.
    # Здесь же GitHub берёт финальный URL из шага `deployment`.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # ========================================================
    #   ШАГИ СБОРКИ
    # ========================================================
    steps:

      # ------------------------------------------------------
      # 1. Клонируем репозиторий в раннер.
      #    fetch-depth: 1 — только последний коммит (быстрее).
      #    persist-credentials: false — не оставляем GITHUB_TOKEN
      #    в .git/config после клонирования (security best practice).
      #    Если когда-нибудь появится шаг, который пушит обратно
      #    (например, авто-коммит бейджа) — уберите этот параметр.
      # ------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # ------------------------------------------------------
      # 2. Ставим Python 3.12 + кэш pip.
      #    cache-dependency-path — ключ кэша по requirements.txt.
      #    Если файла нет — шаг НЕ упадёт, но в логах появится
      #    Warning: "No file matched to [requirements.txt]".
      #    Кэш в этом случае будет пустым (это нормально).
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------
      # 3. Ставим зависимости.
      #    pygbag требует pygame-ce (форк pygame с поддержкой WASM).
      #    pygame-ce>=2.5 — минимальная версия с поддержкой Python 3.12.
      #    Верхняя граница <3 защищает от breaking changes.
      #    pygbag==0.9.3 — точная версия, чтобы сборка была
      #    воспроизводимой (в 0.9.x бывают ломающие изменения).
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pygame-ce>=2.5,<3" pygbag==0.9.3

      # ------------------------------------------------------
      # 4. Собираем игру в WebAssembly (WASM).
      #    `.` — текущая директория как источник (корень проекта).
      #    --build — создать build/web с готовой сборкой.
      #    --ume_block 1 — показываем оверлей «Click to play»,
      #    после клика клавиатура в браузере работает корректно.
      #    --template custom.tmpl — ОБЯЗАТЕЛЬНО: наш шаблон
      #    сохраняет пропорции 3:2 (960×640), без него canvas
      #    растянется на всё окно и картинка исказится.
      # ------------------------------------------------------
      - name: Build with Pygbag
        run: python -m pygbag --build --ume_block 1 --template custom.tmpl .

      # ------------------------------------------------------
      # 5. Проверяем, что сборка не пустая.
      #    Шаг защищает от двух проблем:
      #    а) build/web вообще не создан (pygbag упал молча)
      #    б) build/web создан, но index.html в нём нет
      #       (некорректный шаблон/ошибка в custom.tmpl)
      #
      #    ::error:: — аннотация в UI GitHub Actions, чтобы
      #    ошибка была сразу видна и понятна, а не «exit code 1».
      #
      #    ВНИМАНИЕ: `ls ... || true` — если build/web не
      #    существует, ls падает, и без `|| true` шаг завершается
      #    ДО проверки if. Не убирайте `|| true` при редактировании.
      # ------------------------------------------------------
      - name: Verify build output
        run: |
          ls -la build/web || true
          if [ ! -f build/web/index.html ]; then
            echo "::error::Pygbag не создал build/web/index.html — проверьте вывод сборки выше"
            exit 1
          fi

      # ------------------------------------------------------
      # 6. Готовим Pages (читаем конфиг репозитория).
      #    Если Pages не включён в Settings → Pages
      #    (Source: GitHub Actions) — упадёт здесь
      #    с понятной ошибкой, а не на деплое.
      # ------------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------
      # 7. Загружаем собранное в артефакт для деплоя.
      #    Путь build/web — стандартный для pygbag --build.
      #    retention-days: 1 — не храним артефакт 90 дней
      #    (дефолт). После деплоя он уже не нужен, а квоту жрёт.
      # ------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
          retention-days: 1

      # ------------------------------------------------------
      # 8. Публикуем на GitHub Pages.
      #    id: deployment используется в двух местах:
      #      - environment.url (см. выше) — финальный URL
      #      - шаг 9 — запись URL в Summary workflow
      # ------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ------------------------------------------------------
      # 9. Пишем URL живой игры в Summary workflow.
      #    После успешного деплоя вверху страницы Actions
      #    появится кликабельная ссылка — удобно проверять.
      #
      #    printf вместо echo: на разных bash echo по-разному
      #    обрабатывает \n и -e, printf ведёт себя одинаково.
      #    "$GITHUB_STEP_SUMMARY" в кавычках — безопасно,
      #    даже если переменная окажется пустой.
      # ------------------------------------------------------
      - name: Write deployment URL to summary
        run: |
          {
            printf '## 🚀 Игра задеплоена\n'
            printf '\n'
            printf 'Ссылка: %s\n' "${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"